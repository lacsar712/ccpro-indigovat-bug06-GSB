{% extends "base.html" %}
{% block title %}染缸还原台{% endblock %}
{% block content %}
<div
  x-data="vatBay()"
  x-init="init()"
>
  <div class="chips" role="toolbar" aria-label="工坊筛选">
    <button type="button" class="chip" :class="{ on: (pendingFilter ?? filterWs) === null }" @click="setFilter(null)">全部缸位</button>
    <template x-for="w in workshops" :key="w.id">
      <button
        type="button"
        class="chip"
        :class="{ on: (pendingFilter ?? filterWs) === w.id }"
        @click="setFilter(w.id)"
        x-text="w.name + ' (' + (w.badge || 0) + ')'"
      ></button>
    </template>
  </div>

  {% if error %}
  <div class="error-box">{{ error }}</div>
  {% endif %}
  <div class="error-box" x-show="refreshError" x-cloak>
    工坊缸位局部刷新失败，已保留当前缸位列表，可
    <button type="button" @click="setFilter(filterWs)">重试</button>
    或
    <button type="button" @click="reloadPage()">整页刷新</button>
    （无需重新登录）。
  </div>

  <div class="bay-scroll" role="list">
    <template x-for="v in filteredVats()" :key="v.id">
      <button
        type="button"
        class="vat-card"
        :class="['st-' + v.status, { selected: selectedId === v.id }]"
        role="listitem"
        @click="toggle(v.id)"
      >
        <div class="code" x-text="v.code"></div>
        <div class="meta" x-text="v.workshopName + ' · ' + v.dyeType"></div>
        <div class="status-label">
          <span class="status-dot"></span>
          <span x-text="v.statusLabel"></span>
        </div>
        <svg class="spark" width="72" height="28" viewBox="0 0 72 28" aria-hidden="true">
          <polyline
            x-show="v.spark.length"
            fill="none"
            stroke="#9fd4c8"
            stroke-width="1.6"
            stroke-linejoin="round"
            stroke-linecap="round"
            :points="v.spark.map(p => p.x + ',' + p.y).join(' ')"
          ></polyline>
          <line
            x-show="!v.spark.length"
            x1="4" y1="14" x2="68" y2="14"
            stroke="rgba(216,235,232,0.35)"
            stroke-width="1"
            stroke-dasharray="3 3"
          ></line>
        </svg>
        <div class="mv" :class="{ empty: v.lastRedox === null }">
          <template x-if="v.lastRedox !== null">
            <span x-text="v.lastRedox + ' mV'"></span>
          </template>
          <template x-if="v.lastRedox === null">
            <span>尚无电位</span>
          </template>
        </div>
      </button>
    </template>
  </div>
  <p class="empty-bay" x-show="filteredVats().length === 0" x-cloak>此工坊暂无染缸。</p>

  <div class="panel" x-show="selected()" x-cloak x-transition>
    <template x-if="selected()">
      <div>
        <h2>
          <span x-text="selected().code"></span>
          <span style="font-weight:500;font-size:0.9rem;color:#4a6670;margin-left:0.4rem"
                x-text="selected().workshopName + ' · ' + selected().volumeL + ' L'"></span>
        </h2>
        <p class="hint">当前 <strong x-text="selected().statusLabel"></strong>
          · 最近浸染 <span x-text="selected().lastDippedAt || '—'"></span>
          · 设为可染色须最新批次电位 ≤ -500 mV</p>

        <div class="panel-grid">
          <div>
            <h3 style="font-size:1rem;margin:0 0 0.65rem;color:#1f4d6b">登记浸染</h3>
            <form method="post" :action="'/bay/vats/' + selected().id + '/lots'">
              <input type="hidden" name="workshop" :value="filterWs || ''">
              <label>浸染时间
                <input type="datetime-local" name="dippedAt" required :value="nowLocal()">
              </label>
              <label>布料米数
                <input type="number" name="clothMeters" step="0.01" min="0.01" required placeholder="例如 24.5">
              </label>
              <label>氧化还原电位 (mV，可空)
                <input type="number" name="redoxMv" step="0.01" placeholder="例如 -520">
              </label>
              <button type="submit">写入本缸</button>
            </form>
          </div>
          <div>
            <h3 style="font-size:1rem;margin:0 0 0.65rem;color:#1f4d6b">改缸状态</h3>
            <form method="post" :action="'/bay/vats/' + selected().id + '/status'">
              <input type="hidden" name="workshop" :value="filterWs || ''">
              <label>目标状态
                <select name="status" required :value="selected().status">
                  <option value="idle">闲置</option>
                  <option value="reducing">还原中</option>
                  <option value="ready">可染色</option>
                </select>
              </label>
              <button type="submit">更新状态</button>
            </form>
            <h3 style="font-size:0.95rem;margin:1.25rem 0 0.4rem;color:#1f4d6b">近几笔浸染</h3>
            <ul class="lot-list">
              <template x-for="l in selected().recentLots" :key="l.id">
                <li>
                  <span x-text="l.dippedAt"></span>
                  <span>
                    <span x-text="l.clothMeters + ' m'"></span>
                    ·
                    <span x-text="l.redoxMv === null ? '无电位' : (l.redoxMv + ' mV')"></span>
                  </span>
                </li>
              </template>
              <li x-show="!selected().recentLots.length" style="border:0;color:#6b7c85">尚无记录</li>
            </ul>
          </div>
        </div>
      </div>
    </template>
  </div>

  <p class="rule-foot">工坊只作缸位筛选片；浸染与状态均在缸位展开区内完成，无独立表页。</p>
</div>

<script>
  function vatBay() {
    return {
      workshops: {{ workshops | tojson }},
      vats: {{ vats | tojson }},
      // 与后端同一主键：int 工坊 id 或 null（全部），名称一律不参与过滤
      filterWs: {{ filter_workshop | tojson }},
      selectedId: {{ selected_vat | tojson }},
      refreshError: false,
      loading: false,
      reqSeq: 0,
      pendingFilter: null,
      init() {
        const params = new URLSearchParams(window.location.search);
        if (params.has('vat') && this.selectedId === null) {
          const v = parseInt(params.get('vat'), 10);
          if (!isNaN(v)) this.selectedId = v;
        }
        // URL 里若是名称等非法 token，后端已按“全部”渲染，这里同步掉脏参数
        if (params.get('workshop') && this.filterWs === null) {
          const url = new URL(window.location.href);
          url.searchParams.delete('workshop');
          history.replaceState(null, '', url.pathname + url.search);
        }
        // 后台静默局部刷新；任何失败只提示、不清列表、不清会话
        this.pollTimer = setInterval(() => this.loadScope(this.filterWs, false), 30000);
      },
      setFilter(id) {
        const target = id === null ? null : id;
        // 只先切换 chip 高亮（pendingFilter）；列表等服务端范围结果回来再换，
        // 避免切坊请求在途时旧数据按新坊过滤而闪出空白
        this.pendingFilter = target;
        this.refreshError = false;
        this.loadScope(target, true);
      },
      async loadScope(target, showError) {
        const seq = ++this.reqSeq;
        const qs = target === null
          ? ''
          : '?workshop=' + encodeURIComponent(target);
        this.loading = true;
        try {
          const res = await fetch('/bay/refresh' + qs, {
            headers: { 'Accept': 'application/json' },
            credentials: 'same-origin',
          });
          if (res.status === 401) {
            // 仅会话真正失效时才跳登录；普通网络/过滤错误不走这里
            window.location.assign('/login');
            return;
          }
          if (!res.ok) throw new Error('HTTP ' + res.status);
          const data = await res.json();
          if (seq !== this.reqSeq) return; // 有更新的切坊请求，丢弃过期响应
          // 范围结果回来后才正式生效；即便返回空也与该坊真实缸数一致
          this.vats = Array.isArray(data.vats) ? data.vats : [];
          this.filterWs = data.workshopId ?? null;
          this.pendingFilter = null;
          if (data.badges) {
            this.workshops.forEach(w => {
              if (data.badges[w.id] !== undefined && data.badges[w.id] !== null) {
                w.badge = data.badges[w.id];
              }
            });
          }
          this.refreshError = false;
          if (!this.filteredVats().some(v => v.id === this.selectedId)) {
            this.selectedId = null;
          }
          this.syncUrl();
        } catch (err) {
          if (seq !== this.reqSeq) return;
          // 切坊失败/过滤异常：高亮与列表都回退到当前生效坊，保留现有缸位，
          // 页面与还原台继续可用，无需重登
          this.pendingFilter = null;
          if (showError) this.refreshError = true;
        } finally {
          if (seq === this.reqSeq) this.loading = false;
        }
      },
      reloadPage() {
        window.location.assign(window.location.pathname + window.location.search);
      },
      syncUrl() {
        const url = new URL(window.location.href);
        if (this.filterWs === null) url.searchParams.delete('workshop');
        else url.searchParams.set('workshop', this.filterWs);
        if (this.selectedId) url.searchParams.set('vat', this.selectedId);
        else url.searchParams.delete('vat');
        history.replaceState(null, '', url.pathname + url.search);
      },
      filteredVats() {
        if (this.filterWs === null) return this.vats;
        // 只按主键精确匹配；不再做名称模糊，同名坊互不串缸
        return this.vats.filter(v => v.workshopId === this.filterWs);
      },
      toggle(id) {
        this.selectedId = this.selectedId === id ? null : id;
        this.syncUrl();
      },
      selected() {
        return this.vats.find(v => v.id === this.selectedId) || null;
      },
      nowLocal() {
        const d = new Date();
        d.setMinutes(d.getMinutes() - d.getTimezoneOffset());
        return d.toISOString().slice(0, 16);
      },
    };
  }
</script>
{% endblock %}
